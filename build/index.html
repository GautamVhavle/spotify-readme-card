        <h1>Spotify README Card for GitHub</h1>
        <p>A Spotify README card is an SVG image that shows the song you are playing on your GitHub profile. You deploy it once, then paste the image URL into your README.</p>
        <p><a href="add-spotify-to-github-readme/">Add a Spotify now playing card to your GitHub README</a></p>
        <h2>How do I add a Spotify now playing card to my GitHub README?</h2>
        <p>Create a Spotify app, authorise it once to get a refresh token, deploy the project to Vercel with your client ID, client secret and refresh token as environment variables, then paste the returned image URL into your README as a Markdown image.</p>
        <h2>Is Spotify Readme Card free?</h2>
        <p>Yes. It is MIT licensed, self-hosted on a free Vercel account, and has zero runtime dependencies.</p>
        <h2>Which layouts and themes are available?</h2>
        <p>Three layouts: detailed, compact, and portrait. Eleven built-in themes, plus hex colour overrides for background, text, accent, and border. The portrait card takes its colour from the album art.</p>
